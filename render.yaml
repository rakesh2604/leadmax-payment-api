services:
  - type: web
    name: leadmax-payment
    runtime: python
    buildCommand: pip install -r requirements.txt && python3 manage.py migrate --no-input && python3 manage.py collectstatic --no-input
    startCommand: /opt/render/project/python/bin/gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
