# Blueprint: build/start below. If the service was created in the UI only, set the same
# Build command:  bash build.sh
# Start command:  bash render_start.sh
services:
  - type: web
    name: leadmax-payment
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash render_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
