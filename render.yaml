# Blueprint (IaC). Sync this service from the repo Blueprint, or paste these in the UI:
#   Build:  bash build.sh
#   Start:  bash render_start.sh
services:
  - type: web
    name: leadmax-payment
    runtime: python
    buildCommand: bash build.sh
    startCommand: bash render_start.sh
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "0"
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
